# /etc/apache2/sites-available/arkservice.conf
#
# Needs: a2enmod proxy proxy_http headers ssl rewrite
#
# The one thing that must not be got wrong here is `nocanon`. A trailing bare
# '?' on an ARK is an ARK inflection ("show me the metadata"), not an empty
# query string, and it is the difference between a 302 and a metadata page.
# Without nocanon Apache re-canonicalises the URI and can drop it before
# gunicorn ever sees the request line. After deploying, check:
#
#     curl -sI 'https://ark.digital.utsc.utoronto.ca/ark:/61220/utsc1?' | head -1
#
# That must be 200 with text/plain, NOT a 302.

<VirtualHost *:80>
    ServerName ark.digital.utsc.utoronto.ca
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName ark.digital.utsc.utoronto.ca

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ark.crt
    SSLCertificateKeyFile /etc/ssl/private/ark.key

    # Static assets straight from disk. WhiteNoise would serve these too, but
    # Apache is faster and keeps them off the workers.
    Alias /static/ /var/www/arkservice/staticfiles/
    <Directory /var/www/arkservice/staticfiles>
        Require all granted
        Options -Indexes
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Longer than any staff request should take (a 10k mint, a large export
    # page). A request that outlasts it gets a 504 from Apache, but gunicorn's
    # thread carries on and its work still commits.
    ProxyTimeout 120

    # ttl=3 retires pooled connections to gunicorn before gunicorn's 5 s
    # keep-alive closes them; reusing one gunicorn had already closed was the
    # occasional 502.
    ProxyPass        /static/ !
    ProxyPass        / http://127.0.0.1:8000/ nocanon ttl=3
    ProxyPassReverse / http://127.0.0.1:8000/

    # Request bodies: nothing but bulk bind uploads files, so everything else is
    # held to 1 MiB, and the upload itself to just above BULK_BIND_MAX_BYTES
    # (50 MiB by default). Apache refuses an oversized body before any of it
    # reaches disk; Django's own check only runs once the upload is complete.
    # Raise the second number if BULK_BIND_MAX_BYTES is raised.
    LimitRequestBody 1048576
    <LocationMatch "^/admin/collections/[0-9]+/bulk-bind/$">
        LimitRequestBody 57671680
    </LocationMatch>

    # AllowEncodedSlashes matters because ARKs contain '/' inside the
    # identifier path and qualifiers may contain encoded characters.
    AllowEncodedSlashes NoDecode

    ErrorLog  /var/log/apache2/arkservice-error.log
    CustomLog /var/log/apache2/arkservice-access.log combined
</VirtualHost>
