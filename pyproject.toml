[project]
name = "arkservice"
version = "0.1.0"
description = "ARK identifier minting, binding and resolution service"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "django-htmx>=1.23",
    "celery>=5.5",
    "redis>=5.2",
    "environs[django]>=14.1",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
mysql = ["mysqlclient>=2.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "fakeredis>=2.40.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "arkservice.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B011: bare asserts are the point in tests. SIM300: comparing a constant under
# test against a fixture is not a Yoda condition.
"tests/*" = ["B011", "SIM300"]
