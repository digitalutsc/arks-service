<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporarily unavailable</title>
  <style>
    /* Self-contained on purpose: a 500 page must not depend on anything else being up. */
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #14213d; background: #f4f6f8; }
    .page { max-width: 38rem; margin: 12vh auto; padding: 0 1.25rem; }
    .eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: #5b6672; }
    h1 { font-size: 1.6rem; margin: .2rem 0 .8rem; }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">500</p>
    <h1>The identifier service is temporarily unavailable</h1>
    <p>Something went wrong on our side. The identifier you followed is still valid; please
      try again in a few minutes.</p>
  </main>
</body>
</html>
